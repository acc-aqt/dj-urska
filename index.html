<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Random Video Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="player">
        <h2 id="videoTitle"></h2>
        <video id="video" preload="metadata" autoplay playsinline muted></video>
    </div>
    
    <div class="controls">
    
      <button id="nextBtn">Drop Another One</button>
    
      <button id="muteBtn">Club mode</button>
    
    </div>

  <script src="script.js"></script>
</body>
</html>
