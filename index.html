<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Urška</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="language-switch">

    <button id="langEn">EN</button>
  
    <button id="langSlo">SLO</button>
  
  </div>
    <div class="player">

        <video id="video" preload="metadata" autoplay playsinline muted></video>
        <div class="video-info">

            <div id="videoTitle"></div>
        
            <div id="videoSubtitle"></div>
        
        </div>
    </div>
    
    <div class="controls">
    
      <button id="nextBtn"></button>
    
      <button id="muteBtn"></button>
    
    </div>

    <section class="about">

        <h2 id = "aboutTitle"></h2>
    
        <p id = "aboutP1"></p>

        <p id = "aboutP2"></p>
            
        <p id = "aboutP3"></p>
        
        <img class="about-image" src="assets/Dj-Urska_med_q80.jpeg" alt="DJ Urška">

        <p id = "aboutP4"></p>

        <p id = "aboutP5"></p>

    </section>

  <script src="script.js"></script>
</body>
</html>
